# Parsing scripts configuration

# === OUTPUT DIRECTORY (Silver layer - processed data) ===
output_dir: "data/"

# === RUN CONFIGURATION ===
run:
    genetic_evidence:
        enabled: true
        sources: [gwas_catalog, clinvar, opentargets, genebass]
    clinical_trials:
        enabled: true
        sources: [stitch, dgidb, trialpanorama, chembl, opentargets]

# === GENETIC EVIDENCE INPUTS ===
genetic_evidence:
    gwas_catalog: "data/sources/gwas_catalog/gwas-catalog-associations.tsv.gz"
    clinvar_vcf: "data/sources/clinvar/clinvar.vcf.gz"
    opentargets_association: "data/sources/opentargets/25.12/association_by_datasource_direct"
    # Ontology-propagated counterpart, parsed only via `opentargets.py --indirect`
    opentargets_association_indirect: "data/sources/opentargets/25.12/association_by_datasource_indirect"
    opentargets_target: "data/sources/opentargets/25.12/target"
    genebass_associations: "data/sources/genebass/gene_associations_p1e-7.parquet"
    # Minikel et al. (2024) benchmark arm
    minikel_associations: "data/minikel/assoc.tsv.gz"

# === CLINICAL TRIALS INPUTS ===
clinical_trials:
    # STITCH
    stitch_actions: "data/sources/stitch/actions.tsv.gz"
    stitch_chemical_sources: "data/sources/stitch/chemical_sources.tsv.gz"
    stitch_protein_aliases: "data/sources/stitch/string_protein_aliases.tsv.gz"
    # ChEMBL
    chembl_db: "data/sources/chembl/chembl_36.db"
    # DGIdb
    dgidb_interactions: "data/sources/dgidb/interactions.tsv.gz"
    dgidb_drugs: "data/sources/dgidb/drugs.tsv.gz"
    # TrialPanorama
    trialpanorama_dir: "data/sources/trialpanorama/"
    # Open Targets
    opentargets_known_drug: "data/sources/opentargets/25.12/known_drug"
    # Minikel et al. (2024) Citeline/Pharmaprojects benchmark arm
    minikel_pharmaprojects: "data/minikel/pp.tsv"
    minikel_indications: "data/minikel/indic.tsv"

# === SHARED MAPPINGS ===
mappings:
    efo_ontology: "data/mappings/efo_v3.84.0.obo"
    mesh_to_efo: "data/mappings/mesh_to_efo.tsv"
    mondo_orphanet_hp_to_efo: "data/mappings/mondo_orphanet_hp_to_efo.tsv"
    gene_universe: "data/mappings/protein_coding_genes.txt"
    ukb_phenotype_manifest: "data/mappings/ukb_phenotype_manifest.tsv"

# === THRESHOLDS ===
thresholds:
    # Clinical trials
    stitch_min_score: 700
    chembl_min_pchembl: 7.0
    # Genetic evidence
    gwas_max_pvalue: 5.0e-8
    genebass_max_pvalue: 1.0e-7
    opentargets_min_score: 0.5
    clinvar_max_efo_per_condition: 10
