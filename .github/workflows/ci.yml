name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra mcp --extra parse

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Test
        run: uv run pytest tests/ -v

  # The newest versions pyproject.toml allows, resolved as a fresh `pip install` resolves them.
  # The job above tests only uv.lock's pins, and `uv sync --upgrade` would still hold every
  # package to what all extras accept (genebass's hail keeps pandas below 3).
  test-newest:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the newest allowed dependencies
        run: |
          uv venv
          uv pip install ".[mcp,parse]" pytest

      - name: Test
        run: uv run --no-sync pytest tests/ -v
